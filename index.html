<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions 影音下載控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl max-w-lg w-full border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-1">萬用影音下載器</h1>
        <p class="text-xs text-center text-slate-400 mb-6">基於 GitHub Actions 算力驅動</p>

        <!-- GitHub 設定區塊 (可收合) -->
        <details class="mb-6 bg-slate-900/60 p-4 rounded-xl border border-slate-700" id="configBox">
            <summary class="text-sm font-semibold cursor-pointer text-slate-300">⚙️ GitHub 倉庫授權設定 (初次必填)</summary>
            <div class="space-y-3 mt-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">GitHub 帳號名稱 (Owner)：</label>
                    <input type="text" id="ghOwner" placeholder="例如：your-name"
                           class="w-full px-3 py-1.5 bg-slate-800 border border-slate-600 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">儲存庫名稱 (Repo)：</label>
                    <input type="text" id="ghRepo" placeholder="例如：my-downloader"
                           class="w-full px-3 py-1.5 bg-slate-800 border border-slate-600 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Personal Access Token (PAT)：</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx"
                           class="w-full px-3 py-1.5 bg-slate-800 border border-slate-600 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="saveConfig()" class="w-full bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded transition">
                    儲存設定
                </button>
            </div>
        </details>

        <!-- 任務輸入區塊 -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">影片連結：</label>
                <input type="text" id="videoUrl" placeholder="貼上 YouTube / IG / TikTok / X 連結" 
                       class="w-full px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="flex gap-4">
                <label class="flex items-center text-sm cursor-pointer">
                    <input type="radio" name="mediaType" value="video" checked class="mr-2 accent-blue-500"> 影片 (MP4)
                </label>
                <label class="flex items-center text-sm cursor-pointer">
                    <input type="radio" name="mediaType" value="audio" class="mr-2 accent-blue-500"> 純音樂 (MP3)
                </label>
            </div>

            <button onclick="startWorkflow()" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-2.5 rounded-lg transition duration-200">
                🚀 開始下載處理
            </button>
        </div>

        <!-- 狀態進度顯示區 -->
        <div id="statusArea" class="mt-6 p-4 rounded-xl bg-slate-900/80 border border-slate-700 hidden">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs text-slate-400">執行狀態</span>
                <span id="badge" class="text-xs px-2 py-0.5 rounded font-mono">佇列中...</span>
            </div>
            <p id="statusMsg" class="text-sm text-slate-200">正在傳送指令至 GitHub Actions...</p>
            <div id="downloadAction" class="mt-4 hidden"></div>
        </div>
    </div>

    <script>
        // 頁面載入時讀取儲存的 Token 與設定
        window.onload = () => {
            document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            
            if (localStorage.getItem('gh_token')) {
                document.getElementById('configBox').removeAttribute('open');
            } else {
                document.getElementById('configBox').setAttribute('open', '');
            }
        };

        function saveConfig() {
            localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            alert('設定已儲存！');
        }

        async function startWorkflow() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const mediaType = document.querySelector('input[name="mediaType"]:checked').value;

            if (!owner || !repo || !token) {
                alert('請先在上方設定填寫 GitHub 帳號、儲存庫與 Token！');
                document.getElementById('configBox').setAttribute('open', '');
                return;
            }

            if (!videoUrl) return alert('請填入影片連結！');

            const statusArea = document.getElementById('statusArea');
            const statusMsg = document.getElementById('statusMsg');
            const badge = document.getElementById('badge');
            const btn = document.getElementById('submitBtn');
            const downloadAction = document.getElementById('downloadAction');

            statusArea.classList.remove('hidden');
            downloadAction.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            badge.className = 'text-xs px-2 py-0.5 rounded bg-yellow-900 text-yellow-300 font-mono';
            badge.innerText = '觸發中';
            statusMsg.innerText = '正在指派 GitHub 伺服器啟動下載任務...';

            try {
                // 1. 觸發 GitHub Actions Workflow
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/download.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            video_url: videoUrl,
                            media_type: mediaType
                        }
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || '觸發失敗，請確認 Token 權限或儲存庫名稱。');
                }

                statusMsg.innerText = '伺服器已接受請求，正在啟動環境與下載影片...';
                badge.innerText = '下載中';
                badge.className = 'text-xs px-2 py-0.5 rounded bg-blue-900 text-blue-300 font-mono';

                // 2. 輪詢 GitHub 任務狀態（每 5 秒查詢一次）
                pollWorkflowStatus(owner, repo, token);

            } catch (err) {
                badge.className = 'text-xs px-2 py-0.5 rounded bg-red-900 text-red-300 font-mono';
                badge.innerText = '失敗';
                statusMsg.innerText = '錯誤: ' + err.message;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        async function pollWorkflowStatus(owner, repo, token) {
            const statusMsg = document.getElementById('statusMsg');
            const badge = document.getElementById('badge');
            const btn = document.getElementById('submitBtn');
            const downloadAction = document.getElementById('downloadAction');

            let attempts = 0;
            const maxAttempts = 40; // 最多等待 200 秒

            const timer = setInterval(async () => {
                attempts++;
                try {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    const data = await res.json();
                    const latestRun = data.workflow_runs?.[0];

                    if (latestRun) {
                        if (latestRun.status === 'completed') {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.classList.remove('opacity-50');

                            if (latestRun.conclusion === 'success') {
                                badge.className = 'text-xs px-2 py-0.5 rounded bg-green-900 text-green-300 font-mono';
                                badge.innerText = '完成';
                                statusMsg.innerText = '🎉 處理完成！點擊下方按鈕前往 GitHub 下載檔案：';
                                
                                downloadAction.classList.remove('hidden');
                                downloadAction.innerHTML = `
                                    <a href="${latestRun.html_url}" target="_blank" 
                                       class="block text-center bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg">
                                        👉 前往頁面領取影片 (在頁面最下方 Artifacts)
                                    </a>`;
                            } else {
                                badge.className = 'text-xs px-2 py-0.5 rounded bg-red-900 text-red-300 font-mono';
                                badge.innerText = '任務失敗';
                                statusMsg.innerText = '影片處理失敗（可能為版權限制或無效連結）。';
                            }
                        } else {
                            statusMsg.innerText = `伺服器處理中 (狀態: ${latestRun.status})... 請稍候`;
                        }
                    }

                    if (attempts >= maxAttempts) {
                        clearInterval(timer);
                        statusMsg.innerText = '處理時間較長，請直接至 GitHub Actions 頁面查看進度。';
                        btn.disabled = false;
                        btn.classList.remove('opacity-50');
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 5000);
        }
    </script>
</body>
</html>
